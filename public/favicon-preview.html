<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favicon Preview</title>
    <style>
        body {
            background: #0f1115;
            color: #eff1f5;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
        }
        .icon-display {
            width: 128px;
            height: 128px;
            margin-bottom: 20px;
        }
        .label {
            font-size: 1.2rem;
            color: #8fa1b3;
            margin-top: 10px;
        }
        .small-preview {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            align-items: center;
        }
        img {
            display: block;
        }
    </style>
</head>
<body>
    <div className="container">
        <img src="./favicon.svg" alt="Flagship Favicon" className="icon-display" />
        <div className="label">Modern Flagship Geometric "M" Logo</div>
        
        <div className="small-preview">
            <div>
                <img src="./favicon.svg" width="64" height="64" />
                <div className="label">64x64</div>
            </div>
            <div>
                <img src="./favicon.svg" width="32" height="32" />
                <div className="label">32x32</div>
            </div>
            <div>
                <img src="./favicon.svg" width="16" height="16" />
                <div className="label">16x16</div>
            </div>
        </div>
    </div>
</body>
</html>
